# Local dev stack: WordPress + MySQL + WP-CLI.  Run ./scripts/setup.sh after `docker compose up -d`.
x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: wordpress
  WORDPRESS_DB_USER: wp
  WORDPRESS_DB_PASSWORD: wp
  WORDPRESS_DEBUG: "1"

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6-php8.2-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment: *wp-env
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/fieldnote-shop:/var/www/html/wp-content/themes/fieldnote-shop

  wpcli:
    image: wordpress:cli-php8.2
    user: "33:33"
    profiles: ["tools"]
    depends_on:
      - wordpress
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/fieldnote-shop:/var/www/html/wp-content/themes/fieldnote-shop

volumes:
  db_data:
  wp_data:
